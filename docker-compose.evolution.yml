services:
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api_iza
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - AUTHENTICATION_API_KEY=iza_evolution_secret_key_2026
      - DATABASE_ENABLED=false
      - WEBHOOK_GLOBAL_ENABLED=false
      - LOG_LEVEL=ERROR,WARN,INFO
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  evolution_instances:
