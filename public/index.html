<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IZA WA-Agent Serverless API</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 1rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      text-align: center;
      max-width: 480px;
      border: 1px solid #334155;
    }
    .badge {
      display: inline-block;
      padding: 0.35rem 0.75rem;
      background: #065f46;
      color: #34d399;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.75rem;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .endpoint {
      background: #0f172a;
      padding: 0.75rem;
      border-radius: 0.5rem;
      font-family: monospace;
      font-size: 0.875rem;
      color: #38bdf8;
      word-break: break-all;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">● Online & Ready</div>
    <h1>IZA WA-Agent API</h1>
    <p>Serverless AI Assistant for WhatsApp Financial Tracking with Supabase & Google Sheets.</p>
    <div class="endpoint">POST /api/webhook</div>
  </div>
</body>
</html>
